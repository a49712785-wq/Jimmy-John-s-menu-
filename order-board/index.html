<style id="app-styles">
/* ===== Tokens ===== */
:root{
  --board:#211D17;
  --board-2:#2A251C;
  --board-3:#332C21;
  --chalk:#F3EFE6;
  --chalk-dim:#B7AF9E;
  --chalk-faint:#8A8272;
  --mustard:#E7A93D;
  --mustard-dim:#8A6A2A;
  --pickle:#8DA26A;
  --pickle-dim:#4F5C3C;
  --pepper:#C8583B;
  --pepper-dim:#6B2F20;
  --red:#D22630;
  --red-dim:#7A1B21;
  --red-bright:#EE3A44;
  --line:rgba(243,239,230,0.13);
  --line-strong:rgba(243,239,230,0.24);
  --shadow: 0 1px 0 rgba(0,0,0,0.4);
  --radius:14px;
  --radius-sm:9px;
  --maxw:1180px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--board);
  background-image:
    radial-gradient(ellipse at top left, rgba(231,169,61,0.06), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(141,162,106,0.05), transparent 50%);
  color:var(--chalk);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;}
input,select{font-family:inherit;}
::selection{background:var(--red); color:var(--chalk);}

a{color:inherit;}

/* Chalk texture line under headers */
.chalk-rule{
  height:2px;
  background:repeating-linear-gradient(90deg, var(--chalk-dim) 0 6px, transparent 6px 10px);
  opacity:0.35;
  border:none;
}

/* ===== Layout shells ===== */
#app{display:flex; flex-direction:column; min-height:100vh;}

.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(33,29,23,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:var(--maxw); margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
}
.brand{display:flex; align-items:baseline; gap:9px; cursor:pointer; user-select:none;}
.brand-mark{
  font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.01em;
  color:var(--chalk);
}
.brand-tag{font-size:12px; color:var(--chalk-faint); display:none;}
@media(min-width:640px){.brand-tag{display:inline;}}

.top-nav{display:none; gap:2px;}
@media(min-width:860px){.top-nav{display:flex;}}
.top-nav button{
  background:none; border:none; color:var(--chalk-dim); font-size:14px; font-weight:600;
  padding:9px 14px; border-radius:999px; cursor:pointer; transition:background .15s, color .15s;
}
.top-nav button:hover{color:var(--chalk); background:rgba(243,239,230,0.06);}
.top-nav button.active{color:var(--chalk); background:var(--red);}

.content{flex:1; max-width:var(--maxw); width:100%; margin:0 auto; padding:20px 16px 96px;}
@media(min-width:860px){.content{padding:32px 24px 48px;}}

/* Bottom mobile nav */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:rgba(33,29,23,0.97);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom, 0);
}
@media(min-width:860px){.bottom-nav{display:none;}}
.bottom-nav button{
  flex:1; background:none; border:none; color:var(--chalk-faint);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 2px 8px; font-size:10.5px; font-weight:600; cursor:pointer;
}
.bottom-nav button svg{width:20px; height:20px;}
.bottom-nav button.active{color:var(--red-bright);}

/* ===== Typography ===== */
h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.01em; color:var(--chalk);}
.page-title{font-size:26px; font-weight:700; margin-bottom:4px;}
@media(min-width:640px){.page-title{font-size:31px;}}
.page-sub{color:var(--chalk-dim); font-size:15px; margin:0 0 22px; max-width:52ch; line-height:1.5;}
.section-label{font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--chalk-faint); margin:0 0 10px;}

/* ===== Goal cards (home) ===== */
.goal-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(min-width:640px){.goal-grid{grid-template-columns:repeat(4,1fr);}}
.goal-card{
  position:relative; text-align:left; cursor:pointer;
  background:var(--board-2); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px 14px 14px;
  min-height:96px; display:flex; flex-direction:column; justify-content:space-between;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.goal-card:hover{border-color:var(--line-strong); background:var(--board-3);}
.goal-card:active{transform:scale(0.98);}
.goal-card .g-icon{font-size:20px; opacity:0.9;}
.goal-card .g-title{font-family:var(--font-display); font-weight:600; font-size:15.5px; margin-top:10px; color:var(--chalk);}
.goal-card .g-sub{font-size:12px; color:var(--chalk-dim); margin-top:2px; line-height:1.35;}
.goal-card.wide{grid-column:span 2;}
.goal-card .g-accent{position:absolute; top:0; left:14px; right:14px; height:2px; border-radius:2px; opacity:0.7;}

.quick-row{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 8px;}
.chip{
  background:var(--board-2); border:1px solid var(--line); color:var(--chalk-dim);
  padding:8px 13px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
  white-space:nowrap; transition:all .12s;
}
.chip:hover{border-color:var(--red); color:var(--chalk);}
.chip.active{background:var(--red); color:var(--chalk); border-color:var(--red);}

.util-row{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
.util-btn{
  flex:1; min-width:140px;
  background:transparent; border:1px dashed var(--line-strong); color:var(--chalk-dim);
  padding:12px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer;
  text-align:center;
}
.util-btn:hover{color:var(--chalk); border-color:var(--red);}

/* ===== Cards / results ===== */
.card{
  background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:12px;
}
.card.accent-top{border-top:3px solid var(--red);}

.rec-card{
  background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:12px; position:relative; overflow:hidden;
}
.rec-card.primary{
  border-color:var(--red); background:linear-gradient(180deg, rgba(210,38,48,0.12), var(--board-2) 60%);
  padding:20px 18px;
}
.rec-tag{
  display:inline-block; font-family:var(--font-display); font-weight:700; font-size:11px;
  letter-spacing:0.02em; color:var(--board); background:var(--chalk-dim);
  padding:3px 9px; border-radius:5px; margin-bottom:10px;
}
.rec-card.primary .rec-tag{background:var(--red); color:var(--chalk);}
.rec-tag.value{background:var(--pickle);}
.rec-tag.sodium{background:#7A93B8;}
.rec-tag.protein{background:var(--pepper);}
.rec-tag.cheap{background:var(--chalk-dim);}
.rec-tag.calories{background:var(--pickle-dim);}

.rec-name{font-family:var(--font-display); font-weight:700; font-size:17px; margin:0 0 3px;}
.rec-card.primary .rec-name{font-size:20px;}
.rec-meta{color:var(--chalk-dim); font-size:12px; margin-bottom:2px;}
.rec-stats{display:flex; gap:14px; margin:10px 0 10px; flex-wrap:wrap;}
.rec-stat{font-size:13px; color:var(--chalk);}
.rec-stat b{font-family:var(--font-display); font-size:14px;}
.rec-price{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--red-bright);}
.price-badge{
  font-size:9.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:2px 6px; border-radius:4px; margin-left:6px; vertical-align:2px;
}
.price-badge.confirmed{background:rgba(141,162,106,0.18); color:var(--pickle);}
.price-badge.estimated{background:rgba(210,38,48,0.16); color:var(--red-bright);}
.price-badge.calculated{background:rgba(122,147,184,0.18); color:#93B0DA;}
.rec-why{font-size:13.5px; line-height:1.5; color:var(--chalk-dim); margin:8px 0 12px; padding-top:10px; border-top:1px solid var(--line);}
.rec-why b{color:var(--chalk); font-weight:600;}
.rec-actions{display:flex; gap:8px; flex-wrap:wrap;}

.btn{
  border:none; cursor:pointer; font-weight:600; border-radius:999px; font-size:13px;
  padding:9px 15px; font-family:var(--font-body); transition:all .12s;
}
.btn-primary{background:var(--red); color:var(--chalk);}
.btn-primary:hover{background:var(--red-bright);}
.btn-ghost{background:transparent; border:1px solid var(--line-strong); color:var(--chalk);}
.btn-ghost:hover{border-color:var(--chalk-dim);}
.btn-sm{padding:6px 12px; font-size:12px;}
.btn:disabled{opacity:0.4; cursor:not-allowed;}

/* ===== Trade-off list ===== */
.tradeoff-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:11px 0; border-bottom:1px solid var(--line);
}
.tradeoff-item:last-child{border-bottom:none;}
.tradeoff-rank{font-family:var(--font-display); font-weight:700; color:var(--chalk-faint); width:20px; flex-shrink:0;}
.tradeoff-body{flex:1; min-width:0;}
.tradeoff-name{font-weight:600; font-size:14px;}
.tradeoff-delta{font-size:12px; color:var(--chalk-dim);}
.tradeoff-delta .pos{color:var(--pickle);}
.tradeoff-delta .neg{color:var(--pepper);}

/* ===== Forms ===== */
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(min-width:640px){.field-grid{grid-template-columns:1fr 1fr 1fr;}}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-weight:600; color:var(--chalk-dim);}
.field input, .field select{
  background:var(--board); border:1px solid var(--line-strong); color:var(--chalk);
  padding:10px 11px; border-radius:var(--radius-sm); font-size:14px; outline:none;
}
.field input:focus, .field select:focus{border-color:var(--red);}
.field input::placeholder{color:var(--chalk-faint);}

/* ===== Explore ===== */
.explore-toolbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.search-box{
  flex:0 1 360px; width:360px; max-width:100%; min-width:0;
  display:flex; align-items:center; gap:8px;
  background:var(--board-2); border:1px solid var(--line-strong); border-radius:999px;
  padding:9px 15px; height:48px;
}
.search-box svg{width:19px; height:19px; flex-shrink:0;}
.search-box input{background:none; border:none; color:var(--chalk); outline:none; width:100%; font-size:14px; text-align:left;}
@media(max-width:639px){
  .search-box{ width:100%; flex:1 1 100%; }
}
.filter-btn, .sort-btn{
  background:var(--board-2); border:1px solid var(--line-strong); color:var(--chalk);
  padding:9px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.filter-panel{
  background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:14px;
}
.item-grid{display:grid; grid-template-columns:1fr; gap:10px;}
@media(min-width:640px){.item-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1000px){.item-grid{grid-template-columns:1fr 1fr 1fr;}}
.item-card{
  background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; cursor:pointer; transition:border-color .12s, transform .1s;
}
.item-card:hover{border-color:var(--line-strong);}
.item-card:active{transform:scale(0.99);}
.item-cat{font-size:11px; color:var(--chalk-faint); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.item-name{font-family:var(--font-display); font-weight:600; font-size:15px; margin:3px 0 8px; line-height:1.25;}
.item-row{display:flex; justify-content:space-between; align-items:center;}
.item-price{font-family:var(--font-display); font-weight:700; color:var(--red-bright); font-size:15px;}
.item-macros{font-size:11.5px; color:var(--chalk-dim); margin-top:6px;}
.item-check{
  position:absolute; top:10px; right:10px; width:22px; height:22px; border-radius:6px;
  border:1.5px solid var(--line-strong); display:flex; align-items:center; justify-content:center;
}
.item-card{position:relative;}
.item-check.checked{background:var(--red); border-color:var(--red); color:var(--chalk);}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--chalk-dim);
}
.empty-state .e-icon{font-size:34px; margin-bottom:12px;}
.empty-state h3{color:var(--chalk); font-size:17px; margin-bottom:8px;}
.empty-state .relax-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px;}

.skeleton{background:var(--board-2); border-radius:var(--radius); height:96px; margin-bottom:10px; position:relative; overflow:hidden;}
.skeleton::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(243,239,230,0.05), transparent);
  animation:shimmer 1.3s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}

/* ===== Compare ===== */
.compare-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.compare-slot{
  border:1.5px dashed var(--line-strong); border-radius:var(--radius-sm); padding:10px 14px;
  color:var(--chalk-faint); font-size:13px; cursor:pointer; min-width:120px; text-align:center;
}
.compare-slot.filled{border-style:solid; border-color:var(--line-strong); color:var(--chalk); text-align:left; position:relative; padding-right:34px;}
.compare-slot .remove{position:absolute; top:8px; right:8px; cursor:pointer; color:var(--chalk-dim); background:rgba(243,239,230,0.10); border:1px solid var(--line-strong); font-size:14px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:background .12s, color .12s, border-color .12s;}
.compare-slot .remove svg{width:11px; height:11px;}
.compare-slot .remove:hover{background:rgba(200,88,59,0.22); color:var(--pepper); border-color:rgba(200,88,59,0.4);}
.compare-table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line);}
.compare-table{width:100%; border-collapse:collapse; min-width:480px;}
.compare-table th, .compare-table td{padding:11px 12px; text-align:left; font-size:13.5px; border-bottom:1px solid var(--line);}
.compare-table th{background:var(--board-2); font-family:var(--font-display); font-weight:600; position:sticky; top:0;}
.compare-table td.attr-label{color:var(--chalk-dim); font-weight:600; font-size:12.5px; white-space:nowrap;}
.compare-table td.win{color:var(--pickle); font-weight:700;}
.compare-table tbody tr:nth-child(odd){background:rgba(255,255,255,0.015);}
.compare-highlight{background:rgba(231,169,61,0.06) !important;}

/* ===== Item detail modal ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,13,10,0.72); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
}
@media(min-width:720px){.modal-overlay{align-items:center;}}
.modal-sheet{
  background:var(--board); border:1px solid var(--line-strong); width:100%; max-width:640px;
  max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:20px 18px 28px;
  position:relative;
}
@media(min-width:720px){.modal-sheet{border-radius:var(--radius); padding:26px;}}
.modal-close{
  position:absolute; top:14px; right:14px; background:var(--board-2); border:1px solid var(--line-strong);
  color:var(--chalk); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
}
.detail-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:16px 0;}
@media(min-width:480px){.detail-grid{grid-template-columns:repeat(4,1fr);}}
.detail-stat{background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; text-align:center;}
.detail-stat .n{font-family:var(--font-display); font-weight:700; font-size:17px;}
.detail-stat .l{font-size:10.5px; color:var(--chalk-faint); text-transform:uppercase; letter-spacing:.02em; margin-top:2px;}
.detail-section{margin-top:20px;}
.detail-section h4{font-family:var(--font-display); font-size:14px; margin-bottom:10px; color:var(--chalk-dim);}
.watchout{display:inline-flex; align-items:center; gap:5px; background:rgba(200,88,59,0.14); color:#E08669; padding:5px 10px; border-radius:999px; font-size:12px; font-weight:600; margin:0 6px 6px 0;}
.goodnote{font-size:13.5px; color:var(--chalk-dim); line-height:1.6;}
.cta-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;}
.giant-compare{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
.giant-col{background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px;}
.giant-col h5{font-family:var(--font-display); margin:0 0 8px; font-size:13px; color:var(--chalk-dim);}
.giant-verdict{background:var(--board-2); border-left:3px solid var(--red); padding:12px 14px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; font-size:13.5px; line-height:1.55; margin-top:12px; color:var(--chalk-dim);}
.swap-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px;}
.swap-row:last-child{border-bottom:none;}
.swap-diff{font-size:12px; color:var(--chalk-dim); text-align:right;}
.swap-diff span{display:block;}

/* ===== Build / meal ===== */
.build-layout{display:grid; grid-template-columns:1fr; gap:20px;}
@media(min-width:900px){.build-layout{grid-template-columns:1.3fr 1fr;}}
.meal-summary{
  background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; position:sticky; top:74px; align-self:start;
}
.meal-line{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.meal-line .rm{color:var(--pepper); cursor:pointer; font-size:12px; margin-left:8px;}
.meal-total-row{display:flex; justify-content:space-between; padding:8px 0; font-size:13.5px;}
.meal-total-row b{font-family:var(--font-display);}
.dv-bar{height:5px; background:var(--board); border-radius:4px; overflow:hidden; margin-top:4px;}
.dv-fill{height:100%; background:var(--red); border-radius:4px;}
.dv-fill.over{background:var(--pepper);}

/* ===== My Day ===== */
.myday-empty{text-align:center; padding:40px 20px; color:var(--chalk-dim);}
.saved-meal-card{background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}

/* ===== Misc ===== */
.tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.small-tag{font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:5px; background:rgba(243,239,230,0.08); color:var(--chalk-dim);}
.divider{height:1px; background:var(--line); margin:18px 0; border:none;}
.hint{font-size:12px; color:var(--chalk-faint); margin-top:4px;}
.app-footnote{font-size:12px; color:var(--chalk-faint); line-height:1.5; padding:16px; text-align:center;}
.toast{
  position:fixed; bottom:88px; left:50%; transform:translateX(-50%); z-index:200;
  background:var(--chalk); color:var(--board); padding:10px 18px; border-radius:999px;
  font-size:13px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,0.3);
  animation:toastin .2s ease;
}
@media(min-width:860px){.toast{bottom:24px;}}
@keyframes toastin{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
:focus-visible{outline:2px solid var(--red-bright); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* ===== Add-item picker (Compare "+ Add item") ===== */
.picker-list{display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto; margin-top:2px;}
.picker-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--board-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:10px 12px;
}
.picker-row .btn{flex-shrink:0;}

</style>

<script>
/* =========================================================================
   THE ORDER BOARD — decision engine for the Jimmy John's menu
   Architecture: DATA -> NORMALIZATION -> METRICS -> FILTER/CONSTRAINT ->
                 OPTIMIZATION -> RECOMMENDATION -> EXPLANATION -> UI
   ========================================================================= */

const RAW_ITEMS = JSON.parse(document.getElementById('app-data').textContent);

/* ---- reference daily values (standard FDA reference, used only for %DV
   display in the meal builder — not a claim about any individual item) ---- */
const DV = { calories: 2000, protein: 50, sodium: 2300, fat: 78, carbs: 275 };

const ICONS = {
  find: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  explore: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>',
  compare: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="9" width="6" height="11" rx="1"/><rect x="14" y="4" width="6" height="16" rx="1"/></svg>',
  build: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',
  day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8.5 14.5l2 2 4-4"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg>',
};

/* ---------------------------- normalization ---------------------------- */
// Group key for Regular/Giant size-pair detection & "same dish" grouping.
function baseName(item){
  return item.name.replace(/\s*\(\d+["”]\)\s*$/, '').trim().toLowerCase();
}
RAW_ITEMS.forEach(it => { it.baseName = baseName(it); });

const ITEMS = RAW_ITEMS;
const BY_ID = new Map(ITEMS.map(i => [i.id, i]));
function getItemById(id){ return BY_ID.get(id) || null; }

const CATEGORIES = ['Sandwiches','Favorites','Originals','Plain Slims','Little Johns','Wraps','JJ Gargantuan','Sides','Drinks','Desserts'];
const FOOD_CATEGORIES = CATEGORIES.filter(c => c !== 'Drinks');

/* --------------------------- safe formatting ---------------------------- */
function fmtMoney(v){ return (v===null||v===undefined) ? null : `$${v.toFixed(2)}`; }
function fmtNum(v, d=0){ return (v===null||v===undefined||isNaN(v)) ? '—' : v.toFixed(d); }
function round1(v){ return Math.round(v*10)/10; }

/* --------------------------- metrics (dynamic) --------------------------
   Recomputed defensively from raw nutrition/price rather than only trusting
   the workbook's pre-computed columns, so the app stays internally
   consistent and never divides by zero / produces NaN or Infinity. */
function calcMetrics(item){
  const p = item.price.value;
  const n = item.nutrition;
  const safeDiv = (a,b) => (a==null || b==null || b===0) ? null : a/b;
  return {
    proteinPerDollar: safeDiv(n.protein, p),
    caloriesPerDollar: safeDiv(n.calories, p),
    sodiumPerDollar: safeDiv(n.sodium, p),
    proteinDensity: safeDiv(n.protein*100, n.calories),
    sodiumDensity: safeDiv(n.sodium*100, n.calories),
    costPer100Calories: safeDiv(p*100, n.calories),
  };
}
ITEMS.forEach(it => { it._m = calcMetrics(it); });
// expose the recomputed values under `metrics` (keeps workbook ranks for reference)
ITEMS.forEach(it => {
  it.metrics.proteinPerDollar = it._m.proteinPerDollar;
  it.metrics.caloriesPerDollar = it._m.caloriesPerDollar;
  it.metrics.sodiumPerDollar = it._m.sodiumPerDollar;
  it.metrics.proteinDensity = it._m.proteinDensity;
  it.metrics.sodiumDensity = it._m.sodiumDensity;
  it.metrics.costPer100Calories = it._m.costPer100Calories;
});

/* ---------------------------- pools & pairs ------------------------------ */
const FOOD_POOL = ITEMS.filter(i => i.category !== 'Drinks');
const DRINK_POOL = ITEMS.filter(i => i.category === 'Drinks');

// Regular/Giant (or Regular/Large) pairs, grouped by category + baseName
const PAIR_MAP = new Map(); // baseName+category -> {regular,giant}
ITEMS.forEach(it => {
  const key = it.category + '::' + it.baseName;
  if(!PAIR_MAP.has(key)) PAIR_MAP.set(key, {});
  const slot = PAIR_MAP.get(key);
  if(it.size === 'Regular' || it.size === '1 Regular') slot.regular = it;
  if(it.size === 'Giant') slot.giant = it;
});
function getSizePair(item){
  const key = item.category + '::' + item.baseName;
  const slot = PAIR_MAP.get(key);
  if(!slot || !slot.regular || !slot.giant) return null;
  return slot;
}

/* ------------------------------ watchouts -------------------------------- */
// Neutral, comparative thresholds — never "healthy/unhealthy", never medical claims.
function watchouts(item){
  const n = item.nutrition;
  const tags = [];
  if(n.sodium >= 2000) tags.push('High sodium');
  if(n.calories >= 1000) tags.push('High calorie');
  if(n.fat >= 60) tags.push('High fat');
  return tags;
}
/* ============================ constraint engine ========================== */
function emptyConstraints(){
  return { budget:null, minProtein:null, maxCalories:null, maxSodium:null,
           maxFat:null, maxCarbs:null, category:'all', size:'all' };
}

function passesHard(item, c){
  if(c.category && c.category!=='all' && item.category!==c.category) return false;
  if(c.size && c.size!=='all' && item.size!==c.size) return false;
  if(c.budget!=null && (item.price.value==null || item.price.value > c.budget + 1e-9)) return false;
  if(c.minProtein!=null && item.nutrition.protein < c.minProtein) return false;
  if(c.maxCalories!=null && item.nutrition.calories > c.maxCalories) return false;
  if(c.maxSodium!=null && item.nutrition.sodium > c.maxSodium) return false;
  if(c.maxFat!=null && item.nutrition.fat > c.maxFat) return false;
  if(c.maxCarbs!=null && item.nutrition.carbs > c.maxCarbs) return false;
  return true;
}

function poolFor(c){
  if(c.category === 'Drinks') return DRINK_POOL;
  if(c.category === 'all') return FOOD_POOL; // never let drinks dominate generic goals
  return ITEMS.filter(i => i.category === c.category);
}

function filterItems(c){
  return poolFor(c).filter(i => passesHard(i, c));
}

// how far an item is from satisfying constraints (for "closest alternatives")
function violationScore(item, c){
  let score = 0;
  if(c.category && c.category!=='all' && item.category!==c.category) score += 3;
  if(c.budget!=null && item.price.value!=null && item.price.value > c.budget)
    score += (item.price.value - c.budget) / Math.max(c.budget,1);
  if(c.minProtein!=null && item.nutrition.protein < c.minProtein)
    score += (c.minProtein - item.nutrition.protein) / Math.max(c.minProtein,1);
  if(c.maxCalories!=null && item.nutrition.calories > c.maxCalories)
    score += (item.nutrition.calories - c.maxCalories) / c.maxCalories;
  if(c.maxSodium!=null && item.nutrition.sodium > c.maxSodium)
    score += (item.nutrition.sodium - c.maxSodium) / c.maxSodium;
  return score;
}
function findClosest(c, n=5){
  const pool = poolFor(c).filter(i => !(c.category && c.category!=='all' && i.category!==c.category));
  return pool.map(i => ({item:i, score: violationScore(i,c)}))
             .sort((a,b)=>a.score-b.score).slice(0,n).map(x=>x.item);
}

/* =============================== pareto frontier ========================= */
// dominated if another valid item is <=price, <=calories, >=protein, <=sodium
// and strictly better on at least one axis.
function getParetoFrontier(candidates){
  return candidates.filter(a => {
    return !candidates.some(b => {
      if(b===a) return false;
      if(a.price.value==null || b.price.value==null) return false;
      const priceOK = b.price.value <= a.price.value;
      const calOK = b.nutrition.calories <= a.nutrition.calories;
      const proteinOK = b.nutrition.protein >= a.nutrition.protein;
      const sodiumOK = b.nutrition.sodium <= a.nutrition.sodium;
      const strictlyBetter =
        b.price.value < a.price.value || b.nutrition.calories < a.nutrition.calories ||
        b.nutrition.protein > a.nutrition.protein || b.nutrition.sodium < a.nutrition.sodium;
      return priceOK && calOK && proteinOK && sodiumOK && strictlyBetter;
    });
  });
}

/* =============================== balanced score =========================== */
function normalize(values, v, invert=false){
  const min = Math.min(...values), max = Math.max(...values);
  if(max===min) return 0.5;
  const t = (v-min)/(max-min);
  return invert ? 1-t : t;
}
function balancedScore(item, candidates){
  const proteinDens = candidates.map(i=>i.metrics.proteinDensity ?? 0);
  const sodiumDens = candidates.map(i=>i.metrics.sodiumDensity ?? 0);
  const cals = candidates.map(i=>i.nutrition.calories);
  const ppd = candidates.map(i=>i.metrics.proteinPerDollar ?? 0);

  const proteinEff = normalize(proteinDens, item.metrics.proteinDensity ?? 0);
  const calEff = normalize(cals, item.nutrition.calories, true); // fewer calories = higher score
  const sodiumEff = normalize(sodiumDens, item.metrics.sodiumDensity ?? 0, true);
  const valueEff = normalize(ppd, item.metrics.proteinPerDollar ?? 0);

  const weights = { protein:0.30, calorie:0.20, sodium:0.25, value:0.25 };
  const score = proteinEff*weights.protein + calEff*weights.calorie +
                sodiumEff*weights.sodium + valueEff*weights.value;
  return { score: score*100, parts: {proteinEff, calEff, sodiumEff, valueEff} };
}
function balancedExplanation(parts){
  const labels = [
    ['proteinEff','protein value'], ['sodiumEff','lower sodium'],
    ['valueEff','overall price value'], ['calEff','moderate calories']
  ];
  const sorted = labels.slice().sort((a,b)=>parts[b[0]]-parts[a[0]]);
  const top = sorted.slice(0,2).map(x=>x[1]);
  return `Balanced score favors ${top[0]} and ${top[1]}, weighed against the rest of the menu.`;
}

/* ============================ meaningful-diff thresholds ================= */
const MEANINGFUL = { sodium:150, calories:75, protein:5, price:1.00, proteinPerDollarPct:0.15, diversityPct:0.20 };

/* ============================ semantic tiers (FIND patch) =================
   Used only to bias which candidate is chosen as "Best Match" for general
   goals. Never removes items from Explore, from the qualifying-candidates
   list (result.candidates), or from being shown as an explicit "absolute
   extreme" alt card (e.g. Lowest Calories). */
const SUBSTANTIAL_CATEGORIES = new Set(['Sandwiches','Favorites','Originals','Plain Slims','Little Johns','Wraps','JJ Gargantuan']);
function semanticTier(item){
  if(SUBSTANTIAL_CATEGORIES.has(item.category)) return 1;
  if(item.category==='Sides') return 2;
  if(item.category==='Desserts') return 3;
  return 4; // Drinks
}
// Goals where "Best Match" should be biased toward substantial food when the
// search isn't already scoped to a specific category. High Protein is
// deliberately excluded so the J.J. Gargantuan can still win outright.
const SEMANTIC_GOALS = new Set(['calories','sodium','value','budget','balanced','custom']);
// Shared tier-preference logic: substantial food first, then Sides as a
// fallback, then give up and use everything. Never removes items from the
// qualifying list — only narrows which candidate a recommendation card picks.
function tierPreferredPool(candidates){
  const tier1 = candidates.filter(i=>semanticTier(i)===1);
  if(tier1.length>0) return tier1;
  const tier1and2 = candidates.filter(i=>semanticTier(i)<=2);
  if(tier1and2.length>0) return tier1and2;
  return candidates;
}
function getSemanticCandidatePool(candidates, goalKey, constraints){
  if(constraints.category && constraints.category!=='all') return candidates; // explicit category context is honored as-is
  if(!SEMANTIC_GOALS.has(goalKey)) return candidates;
  return tierPreferredPool(candidates);
}
// Goal-agnostic version used by the secondary recommendation cards (Best
// Value / Lower Sodium / More Protein / Cheapest / Lowest Calories): these
// represent fixed concepts regardless of which goal the user is currently
// browsing, so they always prefer substantial food for a general menu-wide
// query, but still fully defer to an explicit category filter.
function getSemanticFoodPool(candidates, constraints){
  if(constraints.category && constraints.category!=='all') return candidates;
  return tierPreferredPool(candidates);
}
/* ================================ explanations ============================ */
function proteinPhrase(item){
  const p = item.nutrition.protein;
  if(p < 5) return null;
  if(p < 15) return `some protein (${p}g)`;
  if(p < 30) return `meaningful protein (${p}g)`;
  return `substantial protein (${p}g)`;
}

function explainBestMatch(item, goalKey, c){
  const bits = [];
  if(c.minProtein!=null) bits.push(`meets your ${c.minProtein}g+ protein target`);
  if(c.maxCalories!=null) bits.push(`stays under ${c.maxCalories} calories`);
  if(c.maxSodium!=null) bits.push(`stays under ${c.maxSodium}mg sodium`);
  if(c.budget!=null) bits.push(`stays under your $${c.budget.toFixed(0)} budget`);
  if(c.category && c.category!=='all') bits.push(`is a ${c.category.toLowerCase()} option`);

  let goalPhrase = '';
  if(goalKey==='protein') goalPhrase = `delivers the most protein (${item.nutrition.protein}g) among the options that qualify`;
  else if(goalKey==='calories'){
    const pp = proteinPhrase(item);
    goalPhrase = pp ? `keeps calories lowest (${item.nutrition.calories}) among the options that qualify, while providing ${pp}` : `keeps calories lowest (${item.nutrition.calories}) among the options that qualify`;
  }
  else if(goalKey==='sodium'){
    const pp = proteinPhrase(item);
    goalPhrase = pp ? `has the lowest sodium relative to its calories among the options that qualify, while providing ${pp}` : `has the lowest sodium relative to its calories among the options that qualify`;
  }
  else if(goalKey==='value') goalPhrase = `gives the most protein per dollar (${round1(item.metrics.proteinPerDollar)}g/$) among the options that qualify`;
  else if(goalKey==='balanced' || goalKey==='budget' || goalKey==='custom') goalPhrase = `scores best overall once protein, sodium, calories and price are weighed together`;

  if(bits.length===0) return `Best Match because it ${goalPhrase}.`;
  return `Best Match because it ${goalPhrase}, while it also ${bits.join(' and ')}.`;
}

function deltaPhrase(delta, unit, moreWord, lessWord){
  const abs = Math.abs(round1(delta));
  return delta>=0 ? `${moreWord} ${abs}${unit}` : `${lessWord} ${abs}${unit}`;
}

function explainAlt(type, alt, base){
  const pDelta = (alt.price.value!=null && base.price.value!=null) ? alt.price.value - base.price.value : null;
  const priceBit = pDelta==null ? '' : (pDelta<0 ? ` and costs $${Math.abs(pDelta).toFixed(2)} less` : pDelta>0 ? ` but costs $${pDelta.toFixed(2)} more` : ' at the same price');
  if(type==='value') return `Best Value because it provides the most protein per dollar (${round1(alt.metrics.proteinPerDollar)}g/$) among options that meet your requirements.`;
  if(type==='sodium') return `Lower Sodium because it has ${Math.abs(round1(alt.nutrition.sodium-base.nutrition.sodium))}mg less sodium than ${base.name}${priceBit}.`;
  if(type==='protein') return `More Protein because it packs ${Math.abs(round1(alt.nutrition.protein-base.nutrition.protein))}g more protein than ${base.name}${priceBit}.`;
  if(type==='cheap') return `Cheapest Match at $${alt.price.value.toFixed(2)}, ${Math.abs(round1(alt.price.value-base.price.value)).toFixed?('$'+Math.abs(alt.price.value-base.price.value).toFixed(2)):''} less than ${base.name}, while still meeting your requirements.`;
  if(type==='calories') return `Lowest Calories at ${alt.nutrition.calories} cal, ${Math.abs(round1(alt.nutrition.calories-base.nutrition.calories))} fewer than ${base.name}${priceBit}.`;
  return '';
}

function tradeoffLine(alt, base){
  const parts = [];
  const dCal = alt.nutrition.calories - base.nutrition.calories;
  const dProt = alt.nutrition.protein - base.nutrition.protein;
  const dSod = alt.nutrition.sodium - base.nutrition.sodium;
  const dPrice = (alt.price.value!=null && base.price.value!=null) ? alt.price.value - base.price.value : null;
  if(dPrice!=null && Math.abs(dPrice)>=0.10) parts.push(`<span class="${dPrice<0?'pos':'neg'}">${dPrice<0?'-':'+'}$${Math.abs(dPrice).toFixed(2)}</span>`);
  if(Math.abs(dProt)>=1) parts.push(`<span class="${dProt>0?'pos':'neg'}">${dProt>0?'+':''}${round1(dProt)}g protein</span>`);
  if(Math.abs(dCal)>=10) parts.push(`<span class="${dCal<0?'pos':'neg'}">${dCal>0?'+':''}${round1(dCal)} cal</span>`);
  if(Math.abs(dSod)>=20) parts.push(`<span class="${dSod<0?'pos':'neg'}">${dSod>0?'+':''}${round1(dSod)}mg sodium</span>`);
  return parts.join(' · ');
}

/* =========================== recommendation engine ======================== */
function bestByGoal(candidates, goalKey, normSet){
  const norm = normSet || candidates;
  const arr = candidates.slice();
  if(goalKey==='protein') arr.sort((a,b)=> b.nutrition.protein - a.nutrition.protein || (b.metrics.proteinPerDollar??0)-(a.metrics.proteinPerDollar??0));
  else if(goalKey==='calories') arr.sort((a,b)=> a.nutrition.calories - b.nutrition.calories || b.nutrition.protein - a.nutrition.protein);
  else if(goalKey==='sodium') arr.sort((a,b)=> (a.metrics.sodiumDensity??1e9) - (b.metrics.sodiumDensity??1e9) || a.nutrition.sodium-b.nutrition.sodium);
  else if(goalKey==='value') arr.sort((a,b)=> (b.metrics.proteinPerDollar??-1) - (a.metrics.proteinPerDollar??-1));
  else { // balanced / budget / custom
    arr.sort((a,b)=> balancedScore(b,norm).score - balancedScore(a,norm).score);
  }
  return arr[0];
}

function computeRecommendations(constraints, goalKey){
  const candidates = filterItems(constraints);
  if(candidates.length===0){
    return { empty:true, closest: findClosest(constraints, 5), constraints, goalKey };
  }
  const semanticPool = getSemanticCandidatePool(candidates, goalKey, constraints);
  const bestMatch = bestByGoal(semanticPool, goalKey, candidates);
  const rest = candidates.filter(i=>i.id!==bestMatch.id);

  const result = { empty:false, constraints, goalKey, candidates, bestMatch,
    bestMatchWhy: explainBestMatch(bestMatch, goalKey, constraints) };

  // Secondary cards prefer meaningful food over mathematically-trivial items
  // (a pickle, a side of ranch, a cookie), the same way Best Match does — but
  // this only re-ranks candidates for these cards; it never removes anything
  // from `candidates`/`rest`, from Explore, or from the Pareto frontier below.
  // Falls back to the full `rest` pool if no semantic candidates remain, and
  // fully defers to an explicit category filter (handled inside the helper).
  const semanticRest = getSemanticFoodPool(rest, constraints);
  const secondaryPool = semanticRest.length > 0 ? semanticRest : rest;

  // Best Value
  const byValue = secondaryPool.slice().sort((a,b)=>(b.metrics.proteinPerDollar??-1)-(a.metrics.proteinPerDollar??-1))[0];
  if(byValue && (byValue.metrics.proteinPerDollar??0) > (bestMatch.metrics.proteinPerDollar??0)*(1+MEANINGFUL.proteinPerDollarPct)){
    result.bestValue = { item: byValue, why: explainAlt('value', byValue, bestMatch), tradeoff: tradeoffLine(byValue,bestMatch) };
  }

  // Lower Sodium — meaningful-food pick, plus the true mathematical minimum
  // kept visible separately (transparency, not hidden just because it's an
  // odd recommendation).
  const bySodiumSorted = secondaryPool.slice().sort((a,b)=>a.nutrition.sodium-b.nutrition.sodium);
  const bySodium = bySodiumSorted[0];
  if(bySodium && bestMatch.nutrition.sodium - bySodium.nutrition.sodium >= MEANINGFUL.sodium){
    result.lowerSodium = { item: bySodium, why: explainAlt('sodium', bySodium, bestMatch), tradeoff: tradeoffLine(bySodium,bestMatch) };
  }
  const absSodium = rest.slice().sort((a,b)=>a.nutrition.sodium-b.nutrition.sodium)[0];
  if(absSodium && (!bySodium || absSodium.id!==bySodium.id)){
    result.absoluteLowestSodium = absSodium;
  }

  // More Protein — meaningful-food pick, with a soft diversity check so it
  // doesn't just repeat whatever Best Match/Best Value already recommended
  // when a materially close alternative exists. Never forces a weak pick.
  const proteinSorted = secondaryPool.slice().sort((a,b)=>b.nutrition.protein-a.nutrition.protein);
  let byProtein = proteinSorted[0];
  if(byProtein && proteinSorted.length>1){
    const alreadyShown = new Set([bestMatch.id].concat(result.bestValue ? [result.bestValue.item.id] : []));
    if(alreadyShown.has(byProtein.id)){
      const topProtein = byProtein.nutrition.protein;
      const alt = proteinSorted.find(i => !alreadyShown.has(i.id) && i.nutrition.protein >= topProtein*(1-MEANINGFUL.diversityPct));
      if(alt) byProtein = alt; // else keep the duplicate — a weaker forced pick would be worse
    }
  }
  if(byProtein && byProtein.nutrition.protein - bestMatch.nutrition.protein >= MEANINGFUL.protein){
    result.moreProtein = { item: byProtein, why: explainAlt('protein', byProtein, bestMatch), tradeoff: tradeoffLine(byProtein,bestMatch) };
  }

  // Cheapest Match — meaningful-food pick, plus the true cheapest kept
  // visible separately.
  const byCheapSorted = secondaryPool.filter(i=>i.price.value!=null).sort((a,b)=>a.price.value-b.price.value);
  const byCheap = byCheapSorted[0];
  if(byCheap && bestMatch.price.value!=null && bestMatch.price.value - byCheap.price.value >= MEANINGFUL.price){
    result.cheapest = { item: byCheap, why: explainAlt('cheap', byCheap, bestMatch), tradeoff: tradeoffLine(byCheap,bestMatch) };
  }
  const absCheap = rest.filter(i=>i.price.value!=null).sort((a,b)=>a.price.value-b.price.value)[0];
  if(absCheap && (!byCheap || absCheap.id!==byCheap.id)){
    result.absoluteCheapest = absCheap;
  }

  // Lowest Calories — meaningful-food pick, plus the true mathematical
  // minimum (e.g. a pickle) kept visible separately as an analytical extreme.
  const byCaloriesSorted = secondaryPool.slice().sort((a,b)=>a.nutrition.calories-b.nutrition.calories);
  const byCalories = byCaloriesSorted[0];
  if(byCalories && bestMatch.nutrition.calories - byCalories.nutrition.calories >= MEANINGFUL.calories){
    result.lowestCalories = { item: byCalories, why: explainAlt('calories', byCalories, bestMatch), tradeoff: tradeoffLine(byCalories,bestMatch) };
  }
  const absCalories = rest.slice().sort((a,b)=>a.nutrition.calories-b.nutrition.calories)[0];
  if(absCalories && (!byCalories || absCalories.id!==byCalories.id)){
    result.absoluteLowestCalories = absCalories;
  }

  // Pareto frontier -> "your best trade-offs"
  const frontier = getParetoFrontier(candidates);
  const seen = new Set();
  const tradeoffs = [];
  function pushUnique(label, it){
    if(!it || seen.has(it.id)) return;
    seen.add(it.id); tradeoffs.push({label, item: it});
  }
  pushUnique('Best value', frontier.slice().sort((a,b)=>(b.metrics.proteinPerDollar??-1)-(a.metrics.proteinPerDollar??-1))[0]);
  pushUnique('Lowest sodium', frontier.slice().sort((a,b)=>a.nutrition.sodium-b.nutrition.sodium)[0]);
  pushUnique('Highest protein', frontier.slice().sort((a,b)=>b.nutrition.protein-a.nutrition.protein)[0]);
  pushUnique('Lowest calories', frontier.slice().sort((a,b)=>a.nutrition.calories-b.nutrition.calories)[0]);
  result.tradeoffs = tradeoffs.slice(0,4);
  result.frontierSize = frontier.length;
  result.balanced = balancedScore(bestMatch, candidates);

  return result;
}

/* ============================ single-item alternatives ==================== */
function findAlternatives(item, constraints){
  const pool = FOOD_POOL.filter(i => i.id!==item.id && passesHard(i, constraints));
  const sameCat = pool.filter(i=>i.category===item.category);
  const base = sameCat.length>=3 ? sameCat : pool;

  const out = {};
  const lowerSodium = base.filter(i=>item.nutrition.sodium - i.nutrition.sodium >= MEANINGFUL.sodium)
                           .sort((a,b)=>a.nutrition.sodium-b.nutrition.sodium)[0];
  if(lowerSodium) out.lowerSodium = lowerSodium;

  const lowerCalories = base.filter(i=>item.nutrition.calories - i.nutrition.calories >= MEANINGFUL.calories)
                             .sort((a,b)=>a.nutrition.calories-b.nutrition.calories)[0];
  if(lowerCalories) out.lowerCalories = lowerCalories;

  const moreProtein = base.filter(i=>i.nutrition.protein - item.nutrition.protein >= MEANINGFUL.protein)
                           .sort((a,b)=>b.nutrition.protein-a.nutrition.protein)[0];
  if(moreProtein) out.moreProtein = moreProtein;

  const itemPPD = item.metrics.proteinPerDollar ?? 0;
  const betterValue = base.filter(i=>(i.metrics.proteinPerDollar??0) > itemPPD*(1+MEANINGFUL.proteinPerDollarPct))
                           .sort((a,b)=>(b.metrics.proteinPerDollar??0)-(a.metrics.proteinPerDollar??0))[0];
  if(betterValue) out.betterValue = betterValue;

  const cheaper = item.price.value==null ? null : base.filter(i=>i.price.value!=null && item.price.value - i.price.value >= MEANINGFUL.price)
                           .sort((a,b)=>a.price.value-b.price.value)[0];
  if(cheaper) out.cheaper = cheaper;

  return out;
}

/* ============================== size comparison ============================ */
function compareSizes(regular, giant){
  const priceDelta = giant.price.value - regular.price.value;
  const proteinDelta = giant.nutrition.protein - regular.nutrition.protein;
  const calorieDelta = giant.nutrition.calories - regular.nutrition.calories;
  const sodiumDelta = giant.nutrition.sodium - regular.nutrition.sodium;
  const incrementalPPD = (priceDelta && priceDelta!==0) ? proteinDelta/priceDelta : null;
  const estimated = regular.price.confidence!=='confirmed' || giant.price.confidence!=='confirmed';

  let verdict;
  if(incrementalPPD==null){
    verdict = `Price data doesn't allow a reliable incremental comparison here.`;
  } else if(incrementalPPD >= (regular.metrics.proteinPerDollar??0)){
    verdict = `The Giant gives substantially more protein for the additional dollar (${round1(incrementalPPD)}g per extra $), but it also adds ${calorieDelta} calories and ${sodiumDelta}mg sodium — worth it if protein is your main goal, less so if you're watching sodium or calories.`;
  } else {
    verdict = `The extra cost buys ${round1(incrementalPPD)}g of protein per additional dollar — weaker than the Regular's own protein-per-dollar (${round1(regular.metrics.proteinPerDollar)}g/$) — while adding ${calorieDelta} calories and ${sodiumDelta}mg sodium. The Regular is the more efficient order unless you specifically need the extra volume.`;
  }
  if(estimated) verdict += ' (One or both prices here are estimated, not confirmed menu prices — treat the dollar figures as approximate.)';

  return { priceDelta, proteinDelta, calorieDelta, sodiumDelta, incrementalPPD, verdict, estimated };
}

/* ================================ meal totals ============================== */
function mealTotals(items){
  const totals = { calories:0, protein:0, sodium:0, fat:0, carbs:0, price:0, priceKnown:true };
  items.forEach(i=>{
    totals.calories += i.nutrition.calories||0;
    totals.protein += i.nutrition.protein||0;
    totals.sodium += i.nutrition.sodium||0;
    totals.fat += i.nutrition.fat||0;
    totals.carbs += i.nutrition.carbs||0;
    if(i.price.value==null) totals.priceKnown=false; else totals.price += i.price.value;
  });
  totals.dv = {
    calories: Math.min(100, totals.calories/DV.calories*100),
    sodium: Math.min(150, totals.sodium/DV.sodium*100),
  };
  return totals;
}

/* ---- BUILD Meal Optimizer ranking (patch) --------------------------------
   Ranks already-feasible combinations only. Does not touch feasibility
   filtering above, the candidate pool/generator, or anything in FIND/
   Explore/Compare/My Day. */
function overshootTier(totals, constraints){
  if(constraints.minProtein==null) return 0;
  const overshoot = Math.max(0, totals.protein - constraints.minProtein);
  return Math.floor(overshoot / 10); // "reasonably similar" target-satisfaction bucket
}
function rankMealCombinations(results, constraints){
  results.sort((a,b)=>{
    const tierA = overshootTier(a.totals, constraints);
    const tierB = overshootTier(b.totals, constraints);
    if(tierA !== tierB) return tierA - tierB;           // 1) minimize unnecessary protein overshoot

    const priceA = a.totals.price, priceB = b.totals.price;
    if(Math.abs(priceA - priceB) > 0.01) return priceA - priceB; // 2) budget is a ceiling, not a target

    const ppdA = a.totals.protein / Math.max(priceA, 0.01);      // 3) tie-breakers only
    const ppdB = b.totals.protein / Math.max(priceB, 0.01);
    if(Math.abs(ppdA - ppdB) > 1e-6) return ppdB - ppdA;
    if(a.totals.calories !== b.totals.calories) return a.totals.calories - b.totals.calories;
    return a.totals.sodium - b.totals.sodium;
  });
  return results;
}

/* ============================= meal optimizer =============================
   Bounded combination search: filter to a feasible, relevant candidate set
   first (per spec §17: filter before combination generation), then combine. */
function findMealCombinations(constraints, numItems){
  const perItemBudget = constraints.budget!=null ? constraints.budget : Infinity;
  const singleConstraints = Object.assign({}, constraints, { budget: perItemBudget, minProtein: null, maxCalories: null, maxSodium: null });
  let pool = FOOD_POOL.filter(i => passesHard(i, singleConstraints));
  // keep a relevant, small candidate set: best value + best protein + cheap, capped
  pool = pool.slice().sort((a,b)=> (b.metrics.proteinPerDollar??0)-(a.metrics.proteinPerDollar??0));
  const capped = pool.slice(0, 30);

  const results = [];
  function combos(start, chosen){
    if(chosen.length === numItems){
      const totals = mealTotals(chosen);
      if(constraints.budget!=null && totals.price > constraints.budget + 1e-9) return;
      if(constraints.minProtein!=null && totals.protein < constraints.minProtein) return;
      if(constraints.maxCalories!=null && totals.calories > constraints.maxCalories) return;
      if(constraints.maxSodium!=null && totals.sodium > constraints.maxSodium) return;
      results.push({ items: chosen.slice(), totals });
      return;
    }
    if(results.length >= 200) return; // safety cap
    for(let i=start; i<capped.length; i++){
      chosen.push(capped[i]);
      combos(i+1, chosen);
      chosen.pop();
    }
  }
  combos(0, []);
  rankMealCombinations(results, constraints);
  return results.slice(0, 5);
}

/* ================================= routing ================================ */
function encodeB64(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
function decodeB64(str){ try{ return JSON.parse(decodeURIComponent(escape(atob(str)))); }catch(e){ return null; } }

function navigate(screen, opts={}){
  state.screen = screen;
  if(opts.results) state.results = opts.results;
  if(opts.compareIds) state.compareIds = opts.compareIds;
  updateHash();
  window.scrollTo(0,0);
  render();
}

function updateHash(){
  let hash = '#/' + state.screen;
  if(state.screen==='results' && state.results && !state.results.empty){
    hash += '/' + encodeB64({ g: state.results.goalKey, c: state.results.constraints });
  } else if(state.screen==='compare' && state.compareIds.length){
    hash += '/' + state.compareIds.join(',');
  }
  if(window.location.hash !== hash){
    window.location.hash = hash;
  }
}

function loadFromHash(){
  const h = location.hash.replace(/^#\/?/, '');
  if(!h) return false;
  const [screen, param] = h.split('/');
  if(!screen) return false;
  if(screen==='results' && param){
    const decoded = decodeB64(param);
    if(decoded){
      state.results = computeRecommendations(decoded.c, decoded.g);
      state.screen = 'results';
      return true;
    }
  } else if(screen==='compare' && param){
    state.compareIds = param.split(',').filter(id=>BY_ID.has(id));
    state.screen = 'compare';
    return true;
  } else if(['find','explore','compare','build','myday'].includes(screen)){
    state.screen = screen;
    return true;
  }
  return false;
}

  if(c.minProtein!=null) bits.push(`${c.minProtein}g+ protein`);
  if(c.maxCalories!=null && c.maxCalories<100000) bits.push(`under ${c.maxCalories} cal`);
  if(c.maxSodium!=null) bits.push(`under ${c.maxSodium}mg sodium`);
  if(c.maxFat!=null) bits.push(`under ${c.maxFat}g fat`);

/* ---- Compare recommendations (addition) -----------------------------------
   Purely additive: reuses the existing scoring/alternative engine
   (bestByGoal, balancedScore, findAlternatives, MEANINGFUL) rather than
   introducing new scoring rules. Only reads from the currently selected
   comparison items — does not touch state.compareIds, the remove handler,
   comparison table math, or any other module. */
function compareDeltaBits(a, b){
  // a vs b, phrased as what "a" offers relative to "b" — grounded in the
  // same MEANINGFUL thresholds already used elsewhere in the app.
  const bits = [];
  const dProt = a.nutrition.protein - b.nutrition.protein;
  const dSod = b.nutrition.sodium - a.nutrition.sodium;   // positive = a has less sodium
  const dCal = b.nutrition.calories - a.nutrition.calories; // positive = a has fewer calories
  const dPrice = (a.price.value!=null && b.price.value!=null) ? b.price.value - a.price.value : null; // positive = a is cheaper
  if(Math.abs(dProt) >= MEANINGFUL.protein) bits.push(dProt>0 ? `${round1(dProt)}g more protein` : `${round1(Math.abs(dProt))}g less protein`);
  if(Math.abs(dSod) >= MEANINGFUL.sodium) bits.push(dSod>0 ? `${round1(dSod)}mg less sodium` : `${round1(Math.abs(dSod))}mg more sodium`);
  if(Math.abs(dCal) >= MEANINGFUL.calories) bits.push(dCal>0 ? `${round1(dCal)} fewer calories` : `${round1(Math.abs(dCal))} more calories`);
  if(dPrice!=null && Math.abs(dPrice) >= MEANINGFUL.price) bits.push(dPrice>0 ? `$${dPrice.toFixed(2)} cheaper` : `$${Math.abs(dPrice).toFixed(2)} more expensive`);
  return bits;
}

function bestOfTheseExplanation(winner, others, parts){
  const labels = [
    ['proteinEff','more protein for the calories'], ['sodiumEff','lower sodium relative to calories'],
    ['valueEff','better protein per dollar'], ['calEff','fewer calories']
  ];
  const sorted = labels.slice().sort((a,b)=>parts[b[0]]-parts[a[0]]);
  const top = sorted.slice(0,2).map(x=>x[1]);
  let text = `Among the items you're comparing, ${winner.name} has the strongest overall balance here — mainly ${top[0]} and ${top[1]}.`;
  const perOther = others.map(o=>{
    const bits = compareDeltaBits(winner, o);
    return bits.length ? `vs. ${o.name}: ${bits.join(', ')}` : null;
  }).filter(Boolean);
  if(perOther.length) text += ' ' + perOther.join('; ') + '.';
  return text;
}

function betterOptionExplanation(alt, winner){
  const dSod = winner.nutrition.sodium - alt.nutrition.sodium;   // positive = alt lower sodium
  const dProt = alt.nutrition.protein - winner.nutrition.protein; // positive = alt more protein
  const dCal = winner.nutrition.calories - alt.nutrition.calories; // positive = alt fewer calories
  const dPrice = (winner.price.value!=null && alt.price.value!=null) ? winner.price.value - alt.price.value : null; // positive = alt cheaper

  const traits = [];
  if(dSod >= MEANINGFUL.sodium) traits.push('lower sodium');
  else if(-dSod >= MEANINGFUL.sodium) traits.push('higher sodium');
  if(Math.abs(dProt) < MEANINGFUL.protein) traits.push('similar protein');
  else if(dProt >= MEANINGFUL.protein) traits.push('more protein');
  else traits.push('less protein');
  if(dCal >= MEANINGFUL.calories) traits.push('fewer calories');

  let sentence = traits.length ? traits[0] : 'a comparable nutrition profile';
  if(traits.length>1) sentence = traits.slice(0,-1).join(', ') + ' and ' + traits[traits.length-1];
  sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
  if(dPrice!=null && dPrice >= MEANINGFUL.price) sentence += ` for $${dPrice.toFixed(2)} less`;
  else if(dPrice!=null && -dPrice >= MEANINGFUL.price) sentence += `, though it costs $${Math.abs(dPrice).toFixed(2)} more`;
  sentence += ` than ${winner.name}.`;
  return sentence;
}

function compareRecommendations(items){
  if(items.length<2) return null;

  // "Best of These": reuses the same balanced-scoring engine FIND uses for
  // its Balanced goal, scoped to just the selected items (normSet=items) so
  // it never pulls in the wider menu.
  const winner = bestByGoal(items, 'balanced', items);
  const bScore = balancedScore(winner, items);
  const others = items.filter(i=>i.id!==winner.id);
  const why = bestOfTheseExplanation(winner, others, bScore.parts);
  const result = { winner, why };

  // "Better Option to Consider": reuses the existing findAlternatives engine
  // (the same one powering the item-detail modal's "Make my order better"
  // swaps), scoped to real menu items only, no invented items, no hardcoded
  // winner. A candidate is only surfaced if it has no meaningful regression
  // on any of price/protein/sodium/calories versus the winner — i.e. it must
  // be a genuine decision advantage, not a single-metric win with a hidden
  // downside elsewhere.
  const alts = findAlternatives(winner, emptyConstraints());
  const candidateKeys = ['betterValue','lowerSodium','moreProtein','lowerCalories','cheaper'];
  function regressesMeaningfully(alt){
    const priceBad = (alt.price.value!=null && winner.price.value!=null) && (alt.price.value - winner.price.value) >= MEANINGFUL.price;
    const proteinBad = (winner.nutrition.protein - alt.nutrition.protein) >= MEANINGFUL.protein;
    const sodiumBad = (alt.nutrition.sodium - winner.nutrition.sodium) >= MEANINGFUL.sodium;
    const caloriesBad = (alt.nutrition.calories - winner.nutrition.calories) >= MEANINGFUL.calories;
    return priceBad || proteinBad || sodiumBad || caloriesBad;
  }
  function axesImproved(alt){
    let n = 0;
    if(winner.price.value!=null && alt.price.value!=null && (winner.price.value - alt.price.value) >= MEANINGFUL.price) n++;
    if((alt.nutrition.protein - winner.nutrition.protein) >= MEANINGFUL.protein) n++;
    if((winner.nutrition.sodium - alt.nutrition.sodium) >= MEANINGFUL.sodium) n++;
    if((winner.nutrition.calories - alt.nutrition.calories) >= MEANINGFUL.calories) n++;
    if((alt.metrics.proteinPerDollar??0) > (winner.metrics.proteinPerDollar??0)*(1+MEANINGFUL.proteinPerDollarPct)) n++;
    return n;
  }
  let bestAlt = null, bestAxes = 0;
  candidateKeys.forEach(k=>{
    const alt = alts[k];
    if(!alt || items.some(i=>i.id===alt.id)) return; // never re-suggest an already-selected item
    if(regressesMeaningfully(alt)) return;
    const n = axesImproved(alt);
    if(n > bestAxes){ bestAxes = n; bestAlt = alt; }
  });
  if(bestAlt && bestAxes>=1){
    result.betterOption = { item: bestAlt, why: betterOptionExplanation(bestAlt, winner) };
  }

  return result;
}

function renderCompareRecommendations(items){

  if(rec.betterOption){

  return html;
}

function renderCompare(){
  const ids = state.compareIds;
  const items = ids.map(getItemById).filter(Boolean);

  const slots = [];
  for(let i=0;i<Math.max(items.length+1, 2); i++){

    if(item){

        <div style="font-weight:600; font-size:13px;">${item.name}</div>

  }

  }

  return `

    `}
  `;
}

function winnerIdx(items, values, lowerIsBetter){
  const valid = values.map((v,i)=>({v,i})).filter(x=>x.v!=null);
  if(valid.length<2) return -1;
  const best = lowerIsBetter ? Math.min(...valid.map(x=>x.v)) : Math.max(...valid.map(x=>x.v));
  const winners = valid.filter(x=>x.v===best);
  return winners.length===1 ? winners[0].i : -1;
}

function renderCompareTable(items){
  const rows = [
    { label:'Price', get:i=>i.price.value, fmt:i=>i.price.value!=null?fmtMoney(i.price.value)+' '+priceBadgeHTML(i):'Check price', lowerBetter:true },
    { label:'Calories', get:i=>i.nutrition.calories, fmt:i=>i.nutrition.calories, lowerBetter:true },
    { label:'Protein', get:i=>i.nutrition.protein, fmt:i=>i.nutrition.protein+'g', lowerBetter:false },
    { label:'Sodium', get:i=>i.nutrition.sodium, fmt:i=>i.nutrition.sodium+'mg', lowerBetter:true },
    { label:'Fat', get:i=>i.nutrition.fat, fmt:i=>i.nutrition.fat+'g', lowerBetter:true, secondary:true },
    { label:'Carbs', get:i=>i.nutrition.carbs, fmt:i=>i.nutrition.carbs+'g', lowerBetter:true, secondary:true },
    { label:'Protein per $', get:i=>i.metrics.proteinPerDollar, fmt:i=>fmtNum(i.metrics.proteinPerDollar,1)+'g', lowerBetter:false, advanced:true },
    { label:'Calories per $', get:i=>i.metrics.caloriesPerDollar, fmt:i=>fmtNum(i.metrics.caloriesPerDollar,0), lowerBetter:false, advanced:true },
    { label:'Sodium per $', get:i=>i.metrics.sodiumPerDollar, fmt:i=>fmtNum(i.metrics.sodiumPerDollar,0)+'mg', lowerBetter:true, advanced:true },
    { label:'Protein density', get:i=>i.metrics.proteinDensity, fmt:i=>fmtNum(i.metrics.proteinDensity,1)+'/100cal', lowerBetter:false, advanced:true },
    { label:'Sodium density', get:i=>i.metrics.sodiumDensity, fmt:i=>fmtNum(i.metrics.sodiumDensity,0)+'/100cal', lowerBetter:true, advanced:true },
    { label:'Cost / 100 cal', get:i=>i.metrics.costPer100Calories, fmt:i=>i.metrics.costPer100Calories!=null?'$'+fmtNum(i.metrics.costPer100Calories,2):'—', lowerBetter:true, advanced:true },
  ];

  const goal = state.compareGoal;
  const highlightRows = new Set();
  if(goal==='protein') { highlightRows.add('Protein'); highlightRows.add('Protein per $'); }
  if(goal==='sodium') { highlightRows.add('Sodium'); highlightRows.add('Sodium density'); }
  if(goal==='value') { highlightRows.add('Protein per $'); }
  if(goal==='calories') { highlightRows.add('Calories'); }

  const primaryRows = rows.filter(r=>!r.secondary && !r.advanced);
  const secondaryRows = rows.filter(r=>r.secondary);
  const advancedRows = rows.filter(r=>r.advanced);

  function rowHTML(r){
    const values = items.map(r.get);
    const win = winnerIdx(items, values, r.lowerBetter);
    return `<tr class="${highlightRows.has(r.label)?'compare-highlight':''}">
      <td class="attr-label">${r.label}</td>
      ${items.map((i,idx)=>`<td class="${idx===win?'win':''}">${r.fmt(i)}</td>`).join('')}
    </tr>`;
  }

  let goalNote = '';
  if(goal){
    const goalLabel = {protein:'High Protein', sodium:'Lower Sodium', value:'Best Value', calories:'Lower Calories'}[goal];
    if(goalLabel) goalNote = `<p class="hint" style="margin-bottom:10px;">Highlighted rows reflect your <b>${goalLabel}</b> goal.</p>`;
  }

  return `
    ${goalNote}
    <div class="compare-table-wrap">
      <table class="compare-table">
        <thead><tr><th></th>${items.map(i=>`<th>${i.name}</th>`).join('')}</tr></thead>
        <tbody>${primaryRows.map(rowHTML).join('')}</tbody>
      </table>
    </div>
    <details style="margin-top:12px;">
      <summary class="hint" style="cursor:pointer;">Show fat, carbs & value metrics</summary>
      <div class="compare-table-wrap" style="margin-top:10px;">
        <table class="compare-table">
          <tbody>${secondaryRows.map(rowHTML).join('')}${advancedRows.map(rowHTML).join('')}</tbody>
        </table>
      </div>
    </details>
  `;
}

  if(dPrice!=null) diffs.push(`${dPrice<0?'-':'+'}$${Math.abs(dPrice).toFixed(2)}`);
  return `
    <div class="swap-row">
      <div>
        <div style="font-size:12px; font-weight:600; color:var(--chalk-faint); text-transform:uppercase;">${label}</div>
        <div data-action="open-item" data-id="${alt.id}" style="cursor:pointer; font-weight:600; font-size:13.5px;">${alt.name}</div>
      </div>
      <div class="swap-diff">${diffs.map(d=>`<span>${d}</span>`).join('')}</div>
    </div>`;
}

function renderSwaps(item, alts){
  const rows = [
    swapRow('Lower sodium', alts.lowerSodium, item, 'sodium'),
    swapRow('Lower calories', alts.lowerCalories, item, 'calories'),
    swapRow('More protein', alts.moreProtein, item, 'protein'),
    swapRow('Better value', alts.betterValue, item, 'value'),
    swapRow('Cheaper alternative', alts.cheaper, item, 'price'),
  ].filter(Boolean).join('');
  return rows || `<p class="hint">No meaningfully better swap for this item among ${item.category.toLowerCase()} — it's already a solid pick on price and nutrition.</p>`;
}
/* ================================= events & init ============================= */
function withFocusPreserved(fn){
  const active = document.activeElement;
  const field = active && active.dataset ? active.dataset.field : null;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  fn();
  if(field){
    const el = document.querySelector(`[data-field="${CSS.escape(field)}"]`);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}
function rerenderPreserveFocus(){ withFocusPreserved(render); }

function relaxConstraint(field){
  const c = Object.assign({}, state.results.constraints);
  if(field==='budget') c.budget = c.budget!=null ? round1(c.budget*1.5) : null;
  if(field==='maxCalories') c.maxCalories = c.maxCalories!=null ? c.maxCalories+200 : null;
  if(field==='minProtein') c.minProtein = c.minProtein!=null ? Math.max(0, c.minProtein-10) : null;
  if(field==='maxSodium') c.maxSodium = null;
  const results = computeRecommendations(c, state.results.goalKey);
  navigate('results', { results });
}

function handleClick(e){
  const actionEl = e.target.closest('[data-action]');
  if(!actionEl) return;
  const action = actionEl.dataset.action;
  const id = actionEl.dataset.id;

  if(action==='close-modal-overlay' && e.target.closest('.modal-sheet')) return;
  if(action==='close-add-picker-overlay' && e.target.closest('.modal-sheet')) return;

  switch(action){
    case 'nav':
      e.preventDefault();
      navigate(actionEl.dataset.screen);
      break;
    case 'goal-card': {
      const g = GOALS.find(x=>x.key===actionEl.dataset.goal);
      if(g.isCustom){ state.findCustomOpen = !state.findCustomOpen; render(); return; }
      if(g.isBuild){ navigate('build'); return; }
      const results = computeRecommendations(Object.assign(emptyConstraints(), g.constraints), g.key);
      state.compareGoal = g.key;
      navigate('results', { results });
      break;
    }
    case 'preset': {
      const p = PRESETS[+actionEl.dataset.idx];
      const results = computeRecommendations(Object.assign(emptyConstraints(), p.constraints), p.goalKey);
      state.compareGoal = p.goalKey;
      navigate('results', { results });
      break;
    }
    case 'drink-goal': {
      const p = DRINK_GOALS[+actionEl.dataset.idx];
      const results = computeRecommendations(Object.assign(emptyConstraints(), p.constraints), p.goalKey);
      navigate('results', { results });
      break;
    }
    case 'custom-submit': {
      const c = parseCustomConstraints(state.customForm);
      const results = computeRecommendations(c, 'custom');
      navigate('results', { results });
      break;
    }
    case 'budget-explore': {
      const amt = +actionEl.dataset.amount;
      state.budgetExplorerAmount = (state.budgetExplorerAmount===amt) ? null : amt;
      render();
      break;
    }
    case 'relax':
      relaxConstraint(actionEl.dataset.field);
      break;
    case 'open-item':
      openItem(id);
      break;
    case 'close-modal':
    case 'close-modal-overlay':
      closeModal();
      break;
    case 'add-meal':
      addToMeal(getItemById(id));
      break;
    case 'remove-meal':
      removeFromMeal(+actionEl.dataset.idx);
      break;
    case 'toggle-compare': {
      const idx = state.compareIds.indexOf(id);
      if(idx>=0) state.compareIds.splice(idx,1);
      else if(state.compareIds.length<4) state.compareIds.push(id);
      updateHash();
      render();
      break;
    }
    case 'remove-compare': {
      state.compareIds = state.compareIds.filter(x=>x!==id);
      updateHash();
      render();
      break;
    }
    case 'open-add-picker':
      openAddItemPicker();
      break;
    case 'close-add-picker':
    case 'close-add-picker-overlay':
      closeAddItemPicker();
      break;
    case 'add-picker-item': {
      if(!state.compareIds.includes(id) && state.compareIds.length<4){
        state.compareIds.push(id);
        updateHash();
      }
      closeAddItemPicker(); // closes picker and returns to existing Compare state, which re-renders normally
      break;
    }
    case 'compare-from-modal': {
      if(!state.compareIds.includes(id) && state.compareIds.length<4) state.compareIds.push(id);
      closeModal();
      navigate('compare');
      break;
    }
    case 'toggle-filters':
      state.explore.filtersOpen = !state.explore.filtersOpen;
      render();
      break;
    case 'optimize-meal': {
      const num = v => (v===''||v==null||isNaN(Number(v))) ? null : Number(v);
      const c = { budget: num(state.mealOptimizer.budget), minProtein: num(state.mealOptimizer.minProtein) };
      state.mealOptimizer.results = findMealCombinations(c, state.mealOptimizer.numItems);
      render();
      break;
    }
    case 'use-combo': {
      const combo = state.mealOptimizer.results[+actionEl.dataset.idx];
      combo.items.forEach(i=>state.meal.push(i));
      showToast('Added combo to your meal');
      break;
    }
    case 'save-meal': {
      if(state.meal.length===0) return;
      state.savedMeals.push({ name:`Meal ${state.savedMeals.length+1}`, items: state.meal.slice(), totals: mealTotals(state.meal), ts: Date.now() });
      state.meal = [];
      showToast('Saved to My Day');
      navigate('myday');
      break;
    }
    case 'remove-saved-meal':
      state.savedMeals.splice(+actionEl.dataset.idx, 1);
      render();
      break;
  }
}

function handleInput(e){
  const t = e.target;
  const field = t.dataset.field;
  if(!field) return;
  if(field==='explore-search'){ state.explore.search = t.value; rerenderPreserveFocus(); return; }
  if(field==='addpicker-search'){ state.addItemPicker.search = t.value; rerenderPreserveFocus(); return; }
  if(field.startsWith('explore-')){
    const key = field.replace('explore-','');
    const numFields = ['maxPrice','minProtein','maxCalories','maxSodium'];
    state.explore[key] = numFields.includes(key) ? (t.value===''?null:Number(t.value)) : t.value;
    rerenderPreserveFocus();
    return;
  }
  if(field.startsWith('opt-')){
    const key = field.replace('opt-','');
    if(key==='numItems') state.mealOptimizer.numItems = Number(t.value);
    else state.mealOptimizer[key] = t.value;
    return; // no re-render needed until "Find combinations" is clicked
  }
  if(['budget','minProtein','maxCalories','maxSodium','maxFat','maxCarbs','category','size'].includes(field)){
    state.customForm[field] = t.value;
    return; // form fields don't need live re-render
  }
}

function handleChange(e){
  const t = e.target;
  const field = t.dataset.field;
  if(!field) return;
  if(field.startsWith('explore-')){
    const key = field.replace('explore-','');
    state.explore[key] = t.value;
    render();
    return;
  }
  if(field==='opt-numItems'){ state.mealOptimizer.numItems = Number(t.value); return; }
  if(['category','size'].includes(field)){ state.customForm[field] = t.value; return; }
  if(field==='addpicker-category'){ state.addItemPicker.category = t.value; render(); return; }
}

document.addEventListener('click', handleClick);
document.addEventListener('input', handleInput);
document.addEventListener('change', handleChange);
window.addEventListener('popstate', ()=>{ loadFromHash(); render(); });

/* ==================================== init ==================================== */
(function init(){
  const loaded = loadFromHash();
  if(!loaded) state.screen = 'find';
  render();
})();

</script>
</body>
